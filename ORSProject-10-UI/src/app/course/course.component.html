<style>
    .hm {
        background-image: url('assets/img/addPage.png');
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: cover;
        padding-top: 120px;
        padding-bottom: 90px;
        min-height: 100vh;
    }

    .grad {
        background-image: linear-gradient(to bottom right, #ffd3ac, #f79d65);
    }

    .card-style {
        box-shadow: 9px 8px 7px #001a33;
        border-radius: 12px;
    }

    .form-container {
        max-width: 500px;
        margin: auto;
    }

    .form-label {
        font-weight: bold;
        margin-top: 10px;
    }

    .error-text {
        color: red;
        font-size: 13px;
    }
</style>

<div class="hm">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-6 form-container">

                <div class="card card-style grad">
                    <div class="card-body">

                        <!-- TITLE -->
                        <h3 class="text-center text-primary">
                            {{ form.data.id > 0 
                                ? ('Course.Title.Update' | translate) 
                                : ('Course.Title.Add' | translate) }}
                        </h3>

                        <!-- MESSAGE -->
                        <div class="text-center mb-2">
                            <div *ngIf="!form.error && form.message" class="alert alert-success p-1">
                                {{ form.message }}
                            </div>
                            <div *ngIf="form.error && form.message" class="alert alert-danger p-1">
                                {{ form.message }}
                            </div>
                        </div>

                        <!-- NAME -->
                        <label class="form-label">
                            {{'Course.Fields.Name' | translate}} *
                        </label>
                        <input type="text" class="form-control mb-2"
                               [(ngModel)]="form.data.name"
                               name="name"
                               placeholder="Enter Course Name">
                        <div class="error-text">{{form.inputerror.name}}</div>

                        <!-- DURATION -->
                        <label class="form-label">
                            {{'Course.Fields.Duration' | translate}} *
                        </label>
                        <select class="form-control mb-2"
                                [(ngModel)]="form.data.duration"
                                name="duration">
                            <option value="undefined">{{'Common.Select' | translate}}</option>
                            <option [value]="1">1 Year</option>
                            <option [value]="2">2 Year</option>
                            <option [value]="3">3 Year</option>
                            <option [value]="4">4 Year</option>
                            <option [value]="5">5 Year</option>
                        </select>
                        <div class="error-text">{{form.inputerror.duration}}</div>

                        <!-- DESCRIPTION -->
                        <label class="form-label">
                            {{'Course.Fields.Description' | translate}} *
                        </label>
                        <textarea class="form-control mb-2"
                                  [(ngModel)]="form.data.description"
                                  name="description"
                                  rows="3"
                                  placeholder="Enter Short Description"></textarea>
                        <div class="error-text">{{form.inputerror.description}}</div>

                        <!-- BUTTONS -->
                        <div class="text-center mt-3">

                            <button class="btn btn-success me-2"
                                    *ngIf="!form.data.id"
                                    (click)="submit()">
                                {{'Common.Save' | translate}}
                            </button>

                            <button class="btn btn-warning me-2"
                                    *ngIf="!form.data.id"
                                    (click)="reset()">
                                {{'Common.Reset' | translate}}
                            </button>

                            <button class="btn btn-success me-2"
                                    *ngIf="form.data.id"
                                    (click)="submit()">
                                {{'Common.Update' | translate}}
                            </button>

                            <button class="btn btn-primary"
                                    *ngIf="form.data.id"
                                    (click)="forward('/courselist')">
                                {{'Common.Back' | translate}}
                            </button>

                        </div>

                    </div>
                </div>

            </div>

        </div>
    </div>
</div>
