<style>
    .hm {
        background-image: url('assets/img/forget.png');
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: cover;
        padding-top: 120px;
        padding-bottom: 90px;
        min-height: 100vh;
    }

    .grad {
        background-image: linear-gradient(to bottom right, #ffd3ac, #f79d65);
    }

    .card-style {
        box-shadow: 9px 8px 7px #001a33;
        border-radius: 10px;
    }

    .form-container {
        max-width: 500px;
        margin: auto;
    }

    .form-label {
        font-weight: bold;
        margin-top: 10px;
    }

    .error-text {
        color: red;
        font-size: 13px;
    }
</style>

<div class="hm">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-6 form-container">

                <div class="card card-style grad">
                    <div class="card-body">

                        <!-- TITLE -->
                        <h3 class="text-center text-primary">
                            {{'Auth.ForgotPassword' | translate}}
                        </h3>

                        <!-- MESSAGE -->
                        <div class="text-center mb-2">
                            <div *ngIf="!form.error && form.message" class="alert alert-success p-1">
                                {{ form.message }}
                            </div>
                            <div *ngIf="form.error && form.message" class="alert alert-danger p-1">
                                {{ form.message }}
                            </div>
                        </div>

                        <!-- LOGIN ID -->
                        <label class="form-label">
                            {{'User.Fields.LoginId' | translate}} *
                        </label>

                        <div class="input-group mb-2">
                            <span class="input-group-text">
                                <i class="fa fa-envelope"></i>
                            </span>

                            <input type="text" class="form-control" [(ngModel)]="form.data.loginId" name="loginId"
                                [placeholder]="'User.Placeholders.LoginId' | translate">
                        </div>

                        <div class="error-text">{{form.inputerror.loginId}}</div>

                        <!-- BUTTON -->
                        <div class="text-center mt-3">
                            <button class="btn btn-primary" (click)="submit()">
                                {{'Common.Search' | translate}}
                            </button>
                        </div>

                    </div>
                </div>

            </div>

        </div>
    </div>
</div>
