<style> 
    .hm {
        background-image: url('assets/img/addPage.png');
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: cover;
        padding-top: 120px;
        padding-bottom: 90px;
        min-height: 100vh;
    }

    .grad {
        background-image: linear-gradient(to bottom right, #ffd3ac, #f79d65);
    }

    .card-style {
        box-shadow: 9px 8px 7px #001a33;
        border-radius: 12px;
    }

    .form-container {
        max-width: 500px;
        margin: auto;
    }

    .form-label {
        font-weight: bold;
        margin-top: 10px;
    }

    .error-text {
        color: red;
        font-size: 13px;
    }
</style>

<div class="hm">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-6 form-container">

                <div class="card card-style grad">
                    <div class="card-body">

                        <!-- TITLE -->
                        <h3 class="text-center text-primary">
                            {{ form.data.id > 0 ? 'Update Mapping' : 'Add Mapping' }}
                        </h3>

                        <!-- MESSAGE -->
                        <div class="text-center mb-2">
                            <div *ngIf="!form.error && form.message" class="alert alert-success p-1">
                                {{ form.message }}
                                <button type="button" class="close" (click)="closeMessage()">
                                    <span>&times;</span>
                                </button>
                            </div>

                            <div *ngIf="form.error && form.message" class="alert alert-danger p-1">
                                {{ form.message }}
                                <button type="button" class="close" (click)="closeMessage()">
                                    <span>&times;</span>
                                </button>
                            </div>
                        </div>

                        <!-- MAPPING CODE -->
                        <label class="form-label">Mapping Code *</label>
                        <input type="text" class="form-control mb-2"
                               [(ngModel)]="form.data.mappingCode"
                               name="mappingCode"
                               placeholder="Enter Mapping Code">
                        <div class="error-text">{{form.inputerror.mappingCode}}</div>

                        <!-- SOURCE FIELD -->
                        <label class="form-label">Source Field *</label>
                        <input type="text" class="form-control mb-2"
                               [(ngModel)]="form.data.sourseField"
                               name="sourseField"
                               placeholder="Enter Source Field">
                        <div class="error-text">{{form.inputerror.sourseField}}</div>

                        <!-- TARGET FIELD -->
                        <label class="form-label">Target Field *</label>
                        <input type="text" class="form-control mb-2"
                               [(ngModel)]="form.data.targetField"
                               name="targetField"
                               placeholder="Enter Target Field">
                        <div class="error-text">{{form.inputerror.targetField}}</div>

                        <!-- STATUS -->
                        <label class="form-label">Status *</label>
                        <select class="form-control mb-2"
                                [(ngModel)]="form.data.status"
                                name="status">
                            <option value="undefined">Select</option>
                            <option *ngFor="let obj of form.preload.statusList" [value]="obj.key">
                                {{obj.value}}
                            </option>
                        </select>
                        <div class="error-text">{{form.inputerror.status}}</div>

                        <!-- BUTTONS -->
                        <div class="text-center mt-3">

                            <button class="btn btn-success me-2"
                                    *ngIf="!form.data.id"
                                    (click)="submit()">
                                Save
                            </button>

                            <button class="btn btn-warning me-2"
                                    *ngIf="!form.data.id"
                                    (click)="reset()">
                                Reset
                            </button>

                            <button class="btn btn-success me-2"
                                    *ngIf="form.data.id"
                                    (click)="submit()">
                                Update
                            </button>

                            <button class="btn btn-primary"
                                    *ngIf="form.data.id"
                                    (click)="forward('/mappinglist')">
                                Back
                            </button>

                        </div>

                    </div>
                </div>

            </div>

        </div>
    </div>
</div>
