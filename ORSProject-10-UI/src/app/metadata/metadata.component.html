<style>
    .hm {
        background-image: url('assets/img/addPage.png');
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: cover;
        padding-top: 120px;
        padding-bottom: 90px;
        min-height: 100vh;
    }

    .grad {
        background-image: linear-gradient(to bottom right, #ffd3ac, #f79d65);
    }

    .card-style {
        box-shadow: 9px 8px 7px #001a33;
        border-radius: 12px;
    }

    .form-container {
        max-width: 500px;
        margin: auto;
    }

    .form-label {
        font-weight: bold;
        margin-top: 10px;
    }

    .error-text {
        color: red;
        font-size: 13px;
    }
</style>

<div class="hm">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-6 form-container">

                <div class="card card-style grad">
                    <div class="card-body">

                        <!-- TITLE -->
                        <h3 class="text-center text-primary">
                            {{ form.data.id > 0
                            ? ('Metadata.Title.Update' | translate)
                            : ('Metadata.Title.Add' | translate) }}
                        </h3>

                        <!-- MESSAGE -->
                        <div class="text-center mb-2">
                            <div *ngIf="!form.error && form.message" class="alert alert-success p-1">
                                {{ form.message }}
                                <button type="button" class="close" (click)="closeMessage()">
                                    <span>&times;</span>
                                </button>
                            </div>
                            <div *ngIf="form.error && form.message" class="alert alert-danger p-1">
                                {{ form.message }}
                                <button type="button" class="close" (click)="closeMessage()">
                                    <span>&times;</span>
                                </button>
                            </div>
                        </div>

                        <!-- FILE META CODE -->
                        <label class="form-label">
                            File Meta Code *
                        </label>
                        <input type="text" class="form-control mb-2"
                               [(ngModel)]="form.data.fileMetaCode"
                               name="fileMetaCode"
                               placeholder="Enter File Meta Code">
                        <div class="error-text">{{form.inputerror.fileMetaCode}}</div>

                        <!-- FILE NAME -->
                        <label class="form-label">
                            File Name *
                        </label>
                        <input type="text" class="form-control mb-2"
                               [(ngModel)]="form.data.fileName"
                               name="fileName"
                               placeholder="Enter File Name">
                        <div class="error-text">{{form.inputerror.fileName}}</div>

                        <!-- SIZE -->
                        <label class="form-label">
                            Size (in bytes) *
                        </label>
                        <input type="number" class="form-control mb-2"
                               [(ngModel)]="form.data.size"
                               name="size"
                               placeholder="Enter File Size">
                        <div class="error-text">{{form.inputerror.size}}</div>

                        <!-- STATUS -->
                        <label class="form-label">
                            Status *
                        </label>
                        <select class="form-control mb-2"
                                [(ngModel)]="form.data.status"
                                name="status">
                            <option value="undefined">Select</option>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                        <div class="error-text">{{form.inputerror.status}}</div>

                        <!-- BUTTONS -->
                        <div class="text-center mt-3">

                            <button class="btn btn-success me-2"
                                    *ngIf="!form.data.id"
                                    (click)="submit()">
                                Save
                            </button>

                            <button class="btn btn-warning me-2"
                                    *ngIf="!form.data.id"
                                    (click)="reset()">
                                Reset
                            </button>

                            <button class="btn btn-success me-2"
                                    *ngIf="form.data.id"
                                    (click)="submit()">
                                Update
                            </button>

                            <button class="btn btn-primary"
                                    *ngIf="form.data.id"
                                    (click)="forward('/metadatalist')">
                                Back
                            </button>

                        </div>

                    </div>
                </div>

            </div>

        </div>
    </div>
</div>
