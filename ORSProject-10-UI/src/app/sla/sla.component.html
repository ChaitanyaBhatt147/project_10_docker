<style>
    .hm {
        background-image: url('assets/img/addPage.png');
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: cover;
        padding-top: 120px;
        padding-bottom: 90px;
        min-height: 100vh;
    }

    .grad {
        background-image: linear-gradient(to bottom right, #ffd3ac, #f79d65);
    }

    .card-style {
        box-shadow: 9px 8px 7px #001a33;
        border-radius: 12px;
    }

    .form-container {
        max-width: 500px;
        margin: auto;
    }

    .form-label {
        font-weight: bold;
        margin-top: 10px;
    }

    .error-text {
        color: red;
        font-size: 13px;
    }
</style>

<div class="hm">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-6 form-container">

                <div class="card card-style grad">
                    <div class="card-body">

                        <!-- TITLE -->
                        <h3 class="text-center text-primary">
                            {{ form.data.id > 0 ? 'Update SLA' : 'Add SLA' }}
                        </h3>

                        <!-- MESSAGE -->
                        <div class="text-center mb-2">
                            <div *ngIf="!form.error && form.message" class="alert alert-success p-1">
                                {{ form.message }}
                                <button type="button" class="close" (click)="closeMessage()">
                                    <span>&times;</span>
                                </button>
                            </div>

                            <div *ngIf="form.error && form.message" class="alert alert-danger p-1">
                                {{ form.message }}
                                <button type="button" class="close" (click)="closeMessage()">
                                    <span>&times;</span>
                                </button>
                            </div>
                        </div>

                        <!-- SLA CODE -->
                        <label class="form-label">SLA Code *</label>
                        <input type="text" class="form-control mb-2" [(ngModel)]="form.data.slaCode" name="slaCode"
                            placeholder="Enter SLA Code">
                        <div class="error-text">{{form.inputerror.slaCode}}</div>

                        <!-- SERVICE NAME -->
                        <label class="form-label">Service Name *</label>
                        <input type="text" class="form-control mb-2" [(ngModel)]="form.data.serviceName"
                            name="serviceName" placeholder="Enter Service Name">
                        <div class="error-text">{{form.inputerror.serviceName}}</div>

                        <!-- RESPONSE TIME -->
                        <label class="form-label">Response Time (mins) *</label>
                        <input type="number" class="form-control mb-2" [(ngModel)]="form.data.responseTime"
                            name="responseTime" placeholder="Enter Response Time">
                        <div class="error-text">{{form.inputerror.responseTime}}</div>

                        <!-- STATUS -->
                        <label class="form-label">Status *</label>
                        <select class="form-control mb-2" [(ngModel)]="form.data.status" name="status">
                            <option value="undefined">Select</option>
                            <option *ngFor="let obj of form.preload.statusList" [value]="obj.key">
                                {{obj.value}}
                            </option>
                        </select>
                        <div class="error-text">{{form.inputerror.status}}</div>

                        <!-- BUTTONS -->
                        <div class="text-center mt-3">

                            <button class="btn btn-success me-2" *ngIf="!form.data.id" (click)="submit()">
                                Save
                            </button>

                            <button class="btn btn-warning me-2" *ngIf="!form.data.id" (click)="reset()">
                                Reset
                            </button>

                            <button class="btn btn-success me-2" *ngIf="form.data.id" (click)="submit()">
                                Update
                            </button>

                            <button class="btn btn-primary" *ngIf="form.data.id" (click)="forward('/slalist')">
                                Back
                            </button>

                        </div>

                    </div>
                </div>

            </div>

        </div>
    </div>
</div>
