<style>
    .hm {
        background-image: url('assets/img/addPage.png');
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        padding-top: 120px;
        padding-bottom: 90px;
        min-height: 100vh;
    }

    .grad {
        background-image: linear-gradient(to bottom right, #ffd3ac, #f79d65);
    }

    .card-style {
        box-shadow: 9px 8px 7px #001a33;
        border-radius: 12px;
    }

    .form-container {
        max-width: 500px;
        margin: auto;
    }

    .form-label {
        font-weight: bold;
        margin-top: 10px;
    }

    .error-text {
        color: red;
        font-size: 13px;
    }
</style>

<div class="hm">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-6 form-container">

                <div class="card card-style grad">
                    <div class="card-body">

                        <!-- TITLE -->
                        <h3 class="text-center text-primary">
                            {{ form.data.id > 0 
                                ? ('Subject.Title.Update' | translate) 
                                : ('Subject.Title.Add' | translate) }}
                        </h3>

                        <!-- MESSAGE -->
                        <div class="text-center mb-2">
                            <div *ngIf="!form.error && form.message" class="alert alert-success p-1">
                                {{ form.message }}
                            </div>
                            <div *ngIf="form.error && form.message" class="alert alert-danger p-1">
                                {{ form.message }}
                            </div>
                        </div>

                        <!-- NAME -->
                        <label class="form-label">
                            {{'Subject.Fields.Name' | translate}} *
                        </label>
                        <div class="input-group mb-2">
                            <span class="input-group-text"><i class="fa fa-book"></i></span>
                            <input type="text"
                                   class="form-control"
                                   [ngClass]="{'is-invalid': form.inputerror.name}"
                                   [(ngModel)]="form.data.name"
                                   name="name"
                                   placeholder="Enter Subject Name">
                        </div>
                        <div class="error-text">{{form.inputerror.name}}</div>

                        <!-- COURSE -->
                        <label class="form-label">
                            {{'Subject.Fields.Course' | translate}} *
                        </label>
                        <div class="input-group mb-2">
                            <span class="input-group-text"><i class="fa fa-graduation-cap"></i></span>
                            <select class="form-control"
                                    [ngClass]="{'is-invalid': form.inputerror.courseId}"
                                    [(ngModel)]="form.data.courseId"
                                    name="courseId">
                                <option value="undefined">{{'Common.Select' | translate}}</option>
                                <option *ngFor="let obj of form.preload.courseList" [value]="obj.key">
                                    {{obj.value}}
                                </option>
                            </select>
                        </div>
                        <div class="error-text">{{form.inputerror.courseId}}</div>

                        <!-- DESCRIPTION -->
                        <label class="form-label">
                            {{'Subject.Fields.Description' | translate}} *
                        </label>
                        <div class="input-group mb-2">
                            <span class="input-group-text"><i class="fa fa-align-left"></i></span>
                            <textarea class="form-control"
                                      [ngClass]="{'is-invalid': form.inputerror.description}"
                                      [(ngModel)]="form.data.description"
                                      name="description"
                                      rows="3"
                                      placeholder="Enter Short Description"></textarea>
                        </div>
                        <div class="error-text">{{form.inputerror.description}}</div>

                        <!-- BUTTONS -->
                        <div class="text-center mt-3">

                            <button class="btn btn-success me-2 px-4 shadow"
                                    *ngIf="!form.data.id"
                                    (click)="submit()">
                                {{'Common.Save' | translate}}
                            </button>

                            <button class="btn btn-warning me-2 px-4 shadow"
                                    *ngIf="!form.data.id"
                                    (click)="reset()">
                                {{'Common.Reset' | translate}}
                            </button>

                            <button class="btn btn-success me-2 px-4 shadow"
                                    *ngIf="form.data.id"
                                    (click)="submit()">
                                {{'Common.Update' | translate}}
                            </button>

                            <button class="btn btn-primary px-4 shadow"
                                    *ngIf="form.data.id"
                                    (click)="forward('/subjectlist')">
                                {{'Common.Back' | translate}}
                            </button>

                        </div>

                    </div>
                </div>

            </div>

        </div>
    </div>
</div>
