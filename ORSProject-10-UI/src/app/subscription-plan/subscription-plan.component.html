<style>
    .hm {
        background-image: url('assets/img/addPage.png');
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: cover;
        padding-top: 120px;
        padding-bottom: 90px;
        min-height: 100vh;
    }

    .grad {
        background-image: linear-gradient(to bottom right, #ffd3ac, #f79d65);
    }

    .card-style {
        box-shadow: 9px 8px 7px #001a33;
        border-radius: 12px;
    }

    .form-container {
        max-width: 500px;
        margin: auto;
    }

    .form-label {
        font-weight: bold;
        margin-top: 10px;
    }

    .error-text {
        color: red;
        font-size: 13px;
    }
</style>

<div class="hm">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-6 form-container">

                <div class="card card-style grad">
                    <div class="card-body">

                        <!-- TITLE -->
                        <h3 class="text-center text-primary">
                            {{ form.data.id > 0
                            ? 'Update Subscription Plan'
                            : 'Add Subscription Plan' }}
                        </h3>

                        <!-- MESSAGE -->
                        <div class="text-center mb-2">
                            <div *ngIf="!form.error && form.message" class="alert alert-success p-1">
                                {{ form.message }}
                                <button type="button" class="close" (click)="closeMessage()">
                                    <span>&times;</span>
                                </button>
                            </div>
                            <div *ngIf="form.error && form.message" class="alert alert-danger p-1">
                                {{ form.message }}
                                <button type="button" class="close" (click)="closeMessage()">
                                    <span>&times;</span>
                                </button>
                            </div>
                        </div>

                        <!-- PLAN NAME -->
                        <label class="form-label">
                            Plan Name *
                        </label>
                        <input type="text" class="form-control mb-2" [(ngModel)]="form.data.planName" name="planName"
                            placeholder="Enter Plan Name">
                        <div class="error-text">{{form.inputerror.planName}}</div>

                        <!-- PRICE -->
                        <label class="form-label">
                            Price *
                        </label>
                        <input type="number" class="form-control mb-2" [(ngModel)]="form.data.price" name="price"
                            placeholder="Enter Price">
                        <div class="error-text">{{form.inputerror.price}}</div>

                        <!-- VALIDITY DAYS -->
                        <label class="form-label">
                            Validity Days *
                        </label>
                        <input type="number" class="form-control mb-2" [(ngModel)]="form.data.validityDays"
                            name="validityDays" placeholder="Enter Validity Days">
                        <div class="error-text">{{form.inputerror.validityDays}}</div>

                        <!-- BUTTONS -->
                        <div class="text-center mt-3">

                            <button class="btn btn-success me-2" *ngIf="!form.data.id" (click)="submit()">
                                Save
                            </button>

                            <button class="btn btn-warning me-2" *ngIf="!form.data.id" (click)="reset()">
                                Reset
                            </button>

                            <button class="btn btn-success me-2" *ngIf="form.data.id" (click)="submit()">
                                Update
                            </button>

                            <button class="btn btn-primary" *ngIf="form.data.id"
                                (click)="forward('/subscriptionplanlist')">
                                Back
                            </button>

                        </div>

                    </div>
                </div>

            </div>

        </div>
    </div>
</div>
