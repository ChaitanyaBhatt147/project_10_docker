<style>
    .hm {
        background-image: url('assets/img/changePassword.png');
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        padding-top: 120px;
        padding-bottom: 90px;
        min-height: 100vh;
    }

    .grad {
        background-image: linear-gradient(to bottom right, #ffd3ac, #f79d65);
    }

    .card-style {
        box-shadow: 9px 8px 7px #001a33;
        border-radius: 12px;
    }

    .form-container {
        max-width: 450px;
        margin: auto;
    }

    .form-label {
        font-weight: bold;
        margin-top: 10px;
    }

    .error-text {
        color: red;
        font-size: 13px;
    }
</style>

<div class="hm">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-6 form-container">

                <div class="card card-style grad">
                    <div class="card-body">

                        <!-- TITLE -->
                        <h3 class="text-center text-primary">
                            {{'Auth.ChangePassword' | translate}}
                        </h3>

                        <!-- MESSAGE -->
                        <div class="text-center mb-2">
                            <div *ngIf="!form.error && form.message" class="alert alert-success p-1">
                                {{ form.message }}
                                <button type="button" class="close" (click)="closeMessage()">
                                    <span>&times;</span>
                                </button>
                            </div>
                            <div *ngIf="form.error && form.message" class="alert alert-danger p-1">
                                {{ form.message }}
                                <button type="button" class="close" (click)="closeMessage()">
                                    <span>&times;</span>
                                </button>
                            </div>
                        </div>

                        <!-- OLD PASSWORD -->
                        <label class="form-label">
                            {{'Auth.OldPassword' | translate}} *
                        </label>
                        <div class="input-group mb-2">
                            <span class="input-group-text">
                                <i class="fa fa-lock"></i>
                            </span>
                            <input type="password" class="form-control"
                                [ngClass]="{'is-invalid': form.inputerror.oldPassword}"
                                [(ngModel)]="form.data.oldPassword" name="oldPassword" placeholder="Enter Old Password">
                        </div>
                        <div class="error-text">{{form.inputerror.oldPassword}}</div>

                        <!-- NEW PASSWORD -->
                        <label class="form-label">
                            {{'Auth.NewPassword' | translate}} *
                        </label>
                        <div class="input-group mb-2">
                            <span class="input-group-text">
                                <i class="fa fa-key"></i>
                            </span>
                            <input type="password" class="form-control"
                                [ngClass]="{'is-invalid': form.inputerror.newPassword}"
                                [(ngModel)]="form.data.newPassword" name="newPassword" placeholder="Enter New Password">
                        </div>
                        <div class="error-text">{{form.inputerror.newPassword}}</div>

                        <!-- BUTTON -->
                        <div class="text-center mt-3">
                            <button class="btn btn-primary px-4 shadow" (click)="changePassword()">
                                {{'Auth.ChangePassword' | translate}}
                            </button>
                        </div>

                    </div>
                </div>

            </div>

        </div>
    </div>
</div>
