<style>
    .hm {
        background-image: url('assets/img/myProfile.png');
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        padding-top: 120px;
        padding-bottom: 90px;
        min-height: 100vh;
    }

    .grad {
        background-image: linear-gradient(to bottom right, #ffd3ac, #f79d65);
    }

    .card-style {
        box-shadow: 9px 8px 7px #001a33;
        border-radius: 12px;
    }

    .form-container {
        max-width: 550px;
        margin: auto;
    }

    .form-label {
        font-weight: bold;
        margin-top: 10px;
    }

    .error-text {
        color: red;
        font-size: 13px;
    }
</style>

<div class="hm">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-7 form-container">

                <div class="card card-style grad">
                    <div class="card-body">

                        <!-- TITLE -->
                        <h3 class="text-center text-primary">
                            {{'User.Title.Profile' | translate}}
                        </h3>

                        <!-- MESSAGE -->
                        <div class="text-center mb-2">
                            <div *ngIf="!form.error && form.message" class="alert alert-success p-1">
                                {{ form.message }}
                                <button type="button" class="close" (click)="closeMessage()">
                                    <span>&times;</span>
                                </button>
                            </div>
                            <div *ngIf="form.error && form.message" class="alert alert-danger p-1">
                                {{ form.message }}
                                <button type="button" class="close" (click)="closeMessage()">
                                    <span>&times;</span>
                                </button>
                            </div>
                        </div>

                        <!-- FIRST NAME -->
                        <label class="form-label">{{'User.Fields.FirstName' | translate}} *</label>
                        <div class="input-group mb-2">
                            <span class="input-group-text"><i class="fa fa-user"></i></span>
                            <input type="text" class="form-control"
                                [ngClass]="{'is-invalid': form.inputerror.firstName}" [(ngModel)]="form.data.firstName"
                                name="firstName" placeholder="Enter First Name">
                        </div>
                        <div class="error-text">{{form.inputerror.firstName}}</div>

                        <!-- LAST NAME -->
                        <label class="form-label">{{'User.Fields.LastName' | translate}} *</label>
                        <div class="input-group mb-2">
                            <span class="input-group-text"><i class="fa fa-user"></i></span>
                            <input type="text" class="form-control" [ngClass]="{'is-invalid': form.inputerror.lastName}"
                                [(ngModel)]="form.data.lastName" name="lastName" placeholder="Enter Last Name">
                        </div>
                        <div class="error-text">{{form.inputerror.lastName}}</div>

                        <!-- LOGIN ID (READONLY) -->
                        <label class="form-label">{{'User.Fields.LoginId' | translate}} *</label>
                        <div class="input-group mb-2">
                            <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                            <input type="text" class="form-control" [(ngModel)]="form.data.loginId" name="loginId"
                                readonly>
                        </div>

                        <!-- DOB -->
                        <label class="form-label">{{'User.Fields.DOB' | translate}} *</label>
                        <div class="input-group mb-2">
                            <span class="input-group-text"><i class="fa fa-calendar"></i></span>
                            <input type="date" class="form-control" [(ngModel)]="form.data.dob"
                                [ngModel]="form.data.dob | date:'yyyy-MM-dd'" name="dob">
                        </div>
                        <div class="error-text">{{form.inputerror.dob}}</div>

                        <!-- GENDER -->
                        <label class="form-label">{{'User.Fields.Gender' | translate}} *</label>
                        <div class="input-group mb-2">
                            <span class="input-group-text"><i class="fa fa-venus-mars"></i></span>
                            <select class="form-control" [ngClass]="{'is-invalid': form.inputerror.gender}"
                                [(ngModel)]="form.data.gender" name="gender">
                                <option value="">{{'Common.Select' | translate}}</option>
                                <option value="Male">{{'GenderOptions.Male' | translate}}</option>
                                <option value="Female">{{'GenderOptions.Female' | translate}}</option>
                            </select>
                        </div>
                        <div class="error-text">{{form.inputerror.gender}}</div>

                        <!-- MOBILE -->
                        <label class="form-label">{{'User.Fields.Mobile' | translate}} *</label>
                        <div class="input-group mb-2">
                            <span class="input-group-text"><i class="fa fa-phone"></i></span>
                            <input type="text" class="form-control" maxlength="10"
                                [ngClass]="{'is-invalid': form.inputerror.phone}" [(ngModel)]="form.data.phone"
                                name="phone" placeholder="Enter Mobile No">
                        </div>
                        <div class="error-text">{{form.inputerror.phone}}</div>

                        <!-- BUTTONS -->
                        <div class="text-center mt-3">

                            <button class="btn btn-success me-2 px-4 shadow" (click)="myProfile()">
                                {{'Common.Save' | translate}}
                            </button>

                            <button class="btn btn-primary px-4 shadow" (click)="forward('/userlist')">
                                {{'Common.Back' | translate}}
                            </button>

                        </div>

                    </div>
                </div>

            </div>

        </div>
    </div>
</div>
